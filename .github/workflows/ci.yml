name: Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Run deterministic tests with coverage
        run: |
          mkdir -p reports
          pytest tests/unit tests/algorithms tests/db -v \
            --cov=api --cov=bug_tracker --cov=db --cov=log_analyzer \
            --cov=learning_algorithms \
            --cov=pipeline_validator \
            --cov=qa_assistant \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage \
            --html=reports/local-report.html --self-contained-html \
            --junitxml=reports/local-junit.xml

      - name: Run chatbot end-to-end journey
        run: |
          pytest tests/e2e/test_qa_assistant_chat.py -m chatbot -v \
            -o junit_family=legacy \
            --html=reports/chatbot-e2e.html --self-contained-html \
            --junitxml=reports/chatbot-e2e.xml

      - name: Export deterministic RAG evaluation and dashboard baseline
        run: |
          qa-assistant evaluate --output reports/rag-evaluation.json
          qa-assistant dashboard \
            --report reports/rag-evaluation.json \
            --output reports/rag-dashboard.html
          qa-assistant benchmark \
            --repetitions 3 \
            --output reports/rag-benchmark.json
          qa-assistant benchmark-dashboard \
            --report reports/rag-benchmark.json \
            --output reports/rag-benchmark.html
          qa-assistant faithfulness \
            --fail-if-unvalidated \
            --output reports/rag-faithfulness.json
          qa-assistant faithfulness-dashboard \
            --report reports/rag-faithfulness.json \
            --output reports/rag-faithfulness.html

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run deterministic tests
        run: >-
          pytest tests/unit tests/algorithms tests/db
          tests/e2e/test_qa_assistant_chat.py -v

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build pinned Playwright image
        run: docker build --pull --tag qa-compliance-sentry:ci .

      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id qa-compliance-sentry:ci -u)" -ne 0

      - name: Run deterministic tests in container
        run: docker run --rm --init --ipc=host qa-compliance-sentry:ci
