name: Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Run deterministic tests with coverage
        run: |
          mkdir -p reports
          pytest tests/unit tests/db -v \
            --cov=api --cov=bug_tracker --cov=db \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage \
            --html=reports/local-report.html --self-contained-html \
            --junitxml=reports/local-junit.xml

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Run deterministic tests
        run: pytest tests/unit tests/db -v
