name: External smoke tests

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-smoke-tests
  cancel-in-progress: false

jobs:
  external:
    name: API and Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run external tests
        run: |
          mkdir -p reports
          pytest tests/api tests/e2e -m external -v \
            --html=reports/external-report.html --self-contained-html \
            --junitxml=reports/external-junit.xml

      - name: Upload external test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-test-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 14
