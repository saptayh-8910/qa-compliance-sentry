[project]
name = "qa-compliance-sentry"
version = "0.3.0"
description = "Autonomous QA & Compliance Sentry — Stage 2 container foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-html>=4.0",
    "pytest-xdist>=3.5",
    "playwright==1.61.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[project.scripts]
bug-tracker = "bug_tracker.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bug_tracker*", "api*", "db*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"bug_tracker/cli.py" = ["B008"]

[tool.coverage.run]
branch = true
source = ["api", "bug_tracker", "db"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
