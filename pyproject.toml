[project]
name = "qa-compliance-sentry"
version = "0.9.0"
description = "Autonomous QA & Compliance Sentry — AI quality evaluation dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-html>=4.0",
    "pytest-xdist>=3.5",
    "playwright==1.61.0",
    "openai>=1.66",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[project.scripts]
bug-tracker = "bug_tracker.cli:app"
log-analyzer = "log_analyzer.cli:app"
pipeline-validator = "pipeline_validator.cli:app"
qa-assistant = "qa_assistant.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "bug_tracker*",
    "api*",
    "db*",
    "log_analyzer*",
    "learning_algorithms*",
    "pipeline_validator*",
    "qa_assistant*",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"bug_tracker/cli.py" = ["B008"]
"log_analyzer/cli.py" = ["B008"]
"pipeline_validator/cli.py" = ["B008"]
"qa_assistant/cli.py" = ["B008"]
"qa_assistant/dashboard.py" = ["E501"]

[tool.coverage.run]
branch = true
source = [
    "api",
    "bug_tracker",
    "db",
    "learning_algorithms",
    "log_analyzer",
    "pipeline_validator",
    "qa_assistant",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
