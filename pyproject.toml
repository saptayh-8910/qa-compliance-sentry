[project]
name = "qa-compliance-sentry"
version = "0.1.0"
description = "Autonomous QA & Compliance Sentry — Stage 1 portfolio foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-html>=4.0",
    "pytest-xdist>=3.5",
    "playwright>=1.40",
    "requests>=2.31",
    "typer>=0.12",
]

[project.scripts]
bug-tracker = "bug_tracker.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bug_tracker*", "api*", "db*"]
